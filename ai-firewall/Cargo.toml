[package]
name = "ai-firewall"
version = "0.2.1"
edition.workspace = true

license.workspace = true

[dependencies]
ai-firewall-common = { path = "../ai-firewall-common", features = ["user"] }
anyhow = { workspace = true, default-features = true }
aya = { workspace = true }

env_logger = { workspace = true }
libc = { workspace = true }
log = { workspace = true }
tokio = { workspace = true, features = [
    "macros",
    "rt",
    "rt-multi-thread",
    "net",
    "signal",
    "sync",
    "time"
] }
clap = { workspace = true, features = ["derive", "usage", "error-context"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "0.8"
toml_edit = "0.22"
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "layout-cache"] }
[build-dependencies]
anyhow = { workspace = true }
aya-build = { workspace = true }
cargo_metadata = { workspace = true }

[[bin]]
name = "ai-firewall"
path = "src/main.rs"
